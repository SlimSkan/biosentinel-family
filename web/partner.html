<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioSentinel Family</title>
  <link rel="stylesheet" href="style.css">
  <!-- Installable app ("Add to Home screen"): name, icons and colours -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f6f6b">
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BioSentinel">
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</head>
<body>
  <header>
    <h1 id="title">BioSentinel Family</h1>
    <select id="lang"><option value="en">English</option><option value="ar">العربية</option></select>
    <select id="level"></select>
  </header>
  <main>
    <section id="s-result"><h2 data-t="s1"></h2><div id="findings"></div></section>
    <section id="s-quiz" class="locked"><h2 data-t="s2"></h2><div id="quiz"></div></section>
    <section id="s-match" class="locked"><h2 data-t="s3"></h2><div id="match"></div></section>
    <section id="s-couple" class="locked"><h2 data-t="s4"></h2><div id="couple"></div></section>
    <section id="s-counsel" class="locked"><h2 data-t="s5"></h2><div id="counsel"></div></section>
    <section id="s-family" class="locked"><h2 data-t="s6"></h2><div id="family"></div></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
