<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioSentinel Family</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>BioSentinel Family</h1><span class="small">Know together. Decide freely.</span></header>
  <main>
    <section>
      <h2>Continue as guest</h2>
      <p>Choose a demo person. All data is fictional. Open two people in two browser tabs to try the private match.</p>
      <div class="persona-list" id="people"></div>
    </section>
    <section>
      <h2>Counsellor</h2>
      <p><a href="counsellor.html">Open the counsellor console</a> (sees only what couples choose to send).</p>
    </section>
  </main>
  <script>
    const hints = { amina: "Pair with Khalid: shared gene", khalid: "Pair with Amina: shared gene",
                    sara: "Pair with Omar: nothing shared", omar: "Has a variant of uncertain significance" };
    fetch("/api/personas").then(r => r.json()).then(list => {
      document.getElementById("people").innerHTML = list.map(p =>
        `<a href="partner.html?p=${p.id}"><strong>${p.name}</strong><br><span class="small">${hints[p.id] || ""}</span></a>`).join("");
    });
  </script>
</body>
</html>
